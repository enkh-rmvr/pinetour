<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <title>Tailwind дасгал</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-slate-100 p-8">
    <!-- Дасгал 1 -->

    <hr class="my-8" />
    <form class="w-96 mx-auto px-6 py-6 bg-white rounded-lg shadow-lg">
      <!-- ① -->
      <h2 class="text-lg font-bold">Аялал захиалах</h2>
      <!-- ② -->
      <p class="mt-4 text-md font-semibold">Нэр</p>
      <!-- ③ -->
      <input
        class="w-full mt-1 px-2 py-3 border-2 border-slate-300 rounded-sm"
        placeholder="Бат"
      />
      <!-- ④ -->
      <p class="mt-4 text-md font-semibold">Утас</p>
      <!-- ③ -->
      <input
        class="w-full mt-1 px-2 py-3 border-2 border-slate-300 rounded-sm"
        placeholder="9911 2233"
      />
      <!-- ④ -->
      <button
        class="w-full h-13 mt-6 px-3 py-0 bg-emerald-600 rounded-sm text-white font-bold"
      >
        Захиалах
      </button>
      <!-- ⑤ -->
    </form>
  </body>
</html>
