<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>13</title>
    <style>
      .box {
        height: 70px;
        width: 70px;
        background-color: red;
      }
      #boxcont {
        padding: 20px;
        min-width: 220px;
        height: 400px;
        border: 2px black solid;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div id="boxcont">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
      <div class="box">5</div>
      <div class="box">6</div>
    </div>
  </body>
